        }
        .close-chat:hover, .minimize-chat:hover { color: #00f6ff; }

            flex: 1; padding: 10px 15px; border: 1px solid rgba(0, 246, 255, 0.3);
            border-radius: 20px; outline: none; background: rgba(0, 0, 0, 0.5); color: #fff; transition: all 0.2s;
        }
        .ai-chat-input input:focus { border-color: #00f6ff; box-shadow: 0 0 10px rgba(0, 246, 255, 0.3); }
        .ai-chat-input button {
            margin-left: 10px; padding: 10px 20px; background: linear-gradient(90deg, #0056b3, #00f6ff);
            color: white; border: none; border-radius: 20px; cursor: pointer; transition: all 0.2s; font-weight: bold;
        }
        .ai-chat-input button:hover { box-shadow: 0 0 15px #00f6ff; transform: scale(1.05); }

        .typing-indicator {
            display: none; align-self: flex-start; background: transparent; padding: 5px 15px;
            font-size: 13px; color: #00f6ff; font-style: italic; animation: blink 1s infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        .ai-chat-container.minimized { height: 50px; width: 220px; overflow: hidden; }
        .ai-chat-container.minimized .ai-chat-messages,
        .ai-chat-container.minimized .ai-chat-input,
        .ai-chat-container.minimized .typing-indicator { display: none; }

            .ai-chat-container { width: 90%; height: 60%; left: 5%; right: 5%; top: 10%; }
            .ai-float-ball { top: 15px; left: 15px; }
        }
    </style>

<script>
    // 延迟加载 iframe，让主图表优先获得算力
    window.onload = function() {
        var iframe = document.getElementById('bg-iframe');
        if(iframe && iframe.getAttribute('data-src')) {
            iframe.src = iframe.getAttribute('data-src');
        }
    };

    // AI聊天功能实现
    document.addEventListener('DOMContentLoaded', function() {
        const apiKey = 'apikey';
        const chatContainer = document.getElementById('aiChatContainer');
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendButton = document.getElementById('sendMessage');
        const aiFloatBall = document.getElementById('aiFloatBall');
        const closeChat = document.getElementById('closeChat');
        const minimizeChat = document.getElementById('minimizeChat');
        const typingIndicator = document.getElementById('typingIndicator');
        const chatHeader = document.getElementById('chatHeader');
        const resizeHandle = document.getElementById('resizeHandle');

        let isDragging = false, isResizing = false;
        let startX, startY, startWidth, startHeight, startLeft, startTop;

        // 悬浮球点击事件
        aiFloatBall.addEventListener('click', function(e) {
            e.preventDefault();
            chatContainer.style.display = 'flex';
            adjustWindowPosition();
        });

        closeChat.addEventListener('click', () => chatContainer.style.display = 'none');

        minimizeChat.addEventListener('click', function() {
            chatContainer.classList.toggle('minimized');
            minimizeChat.textContent = chatContainer.classList.contains('minimized') ? '+' : '−';
        });

        // 拖动
        chatHeader.addEventListener('mousedown', function(e) {
            if (e.target === chatHeader || e.target.tagName === 'H3') {
                isDragging = true;
                startX = e.clientX; startY = e.clientY;
                startLeft = parseInt(getComputedStyle(chatContainer).left) || 0;
                startTop = parseInt(getComputedStyle(chatContainer).top) || 0;
                document.addEventListener('mousemove', onDrag);
                document.addEventListener('mouseup', stopDrag);
            }
        });

        function onDrag(e) {
            if (!isDragging) return;
            const dx = e.clientX - startX, dy = e.clientY - startY;
            let newLeft = startLeft + dx, newTop = startTop + dy;
            const maxLeft = window.innerWidth - chatContainer.offsetWidth;
            const maxTop = window.innerHeight - chatContainer.offsetHeight;
            newLeft = Math.max(0, Math.min(newLeft, maxLeft));
            newTop = Math.max(0, Math.min(newTop, maxTop));
            chatContainer.style.left = newLeft + 'px';
            chatContainer.style.top = newTop + 'px';
        }

        function stopDrag() {
            isDragging = false;
            document.removeEventListener('mousemove', onDrag);
            document.removeEventListener('mouseup', stopDrag);
        }

        // 调整大小
        resizeHandle.addEventListener('mousedown', function(e) {
            isResizing = true;
            startX = e.clientX; startY = e.clientY;
            startWidth = parseInt(getComputedStyle(chatContainer).width);
            startHeight = parseInt(getComputedStyle(chatContainer).height);
            document.addEventListener('mousemove', onResize);
            document.addEventListener('mouseup', stopResize);
        });

        function onResize(e) {
            if (!isResizing) return;
            let newWidth = startWidth + (e.clientX - startX);
            let newHeight = startHeight + (e.clientY - startY);
            newWidth = Math.max(350, newWidth);
            newHeight = Math.max(400, newHeight);
            const maxWidth = window.innerWidth - parseInt(getComputedStyle(chatContainer).left || 0);
            const maxHeight = window.innerHeight - parseInt(getComputedStyle(chatContainer).top || 0);
            chatContainer.style.width = Math.min(newWidth, maxWidth) + 'px';
            chatContainer.style.height = Math.min(newHeight, maxHeight) + 'px';
        }

        function stopResize() {
            isResizing = false;
            document.removeEventListener('mousemove', onResize);
            document.removeEventListener('mouseup', stopResize);
        }

        function adjustWindowPosition() {
            const rect = chatContainer.getBoundingClientRect();
            const maxLeft = window.innerWidth - rect.width, maxTop = window.innerHeight - rect.height;
            let left = parseInt(getComputedStyle(chatContainer).left || 0), top = parseInt(getComputedStyle(chatContainer).top || 0);
            if (left < 0) chatContainer.style.left = '0px';
            if (left > maxLeft) chatContainer.style.left = maxLeft + 'px';
            if (top < 0) chatContainer.style.top = '0px';
            if (top > maxTop) chatContainer.style.top = maxTop + 'px';
        }

        function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;
            addMessage(message, 'user');
            userInput.value = '';
            typingIndicator.style.display = 'block';
            scrollToBottom();
            callAIAPI(message);
        }

        sendButton.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });

        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}-message`;
            messageDiv.innerHTML = text; // allow basic html from AI
            chatMessages.appendChild(messageDiv);
            scrollToBottom();
        }

        function scrollToBottom() { chatMessages.scrollTop = chatMessages.scrollHeight; }

        async function callAIAPI(userMessage) {
            try {
                const response = await fetch('https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${apiKey}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: 'deepseek-v3.1',
                        messages: [
                            { role: 'system', content: '你是一个专业的AI助手，专注于回答关于中国人口老龄化、数据分析、养老政策等相关问题。要求：专业、准确、语言精炼排版美观。' },
                            { role: 'user', content: userMessage }
                        ],
                        stream: false
                    })
                });
                if (!response.ok) throw new Error(`API请求失败: ${response.status}`);
                const data = await response.json();
                typingIndicator.style.display = 'none';
                if (data.choices && data.choices.length > 0) {
                    addMessage(data.choices[0].message.content.replace(/\n/g, '<br/>'), 'ai');
                } else {
                    addMessage('抱歉，我没有收到有效的回复。', 'ai');
                }
            } catch (error) {
                console.error('API调用错误:', error);
                typingIndicator.style.display = 'none';
                addMessage('抱歉，发生了错误，请检查网络或稍后再试。', 'ai');
            }
        }
        window.addEventListener('resize', adjustWindowPosition);
    });
</script>

<script>
    // ============================================================
    // 修复1：地图 visualMap（色阶）位置 —— 定位到地图容器左下角
    // 修复2：左下角 fb1/fb2/fb3 图例与图表重叠
    // ============================================================
    (function applyFixes() {
        function fixMapVisualMap() {
            var mapDom = document.getElementById('map_1');
            if (!mapDom) return;
            var chart = echarts.getInstanceByDom(mapDom);
            if (!chart) { setTimeout(fixMapVisualMap, 300); return; }
            chart.setOption({
                visualMap: {
                    left: '25%',
                    bottom: '5%'
                }
            });
        }

        function fixFbLegends() {
            // fb1 老年年龄层次：把legend移到底部，避免与饼图重叠
            var fb1dom = document.getElementById('fb1');
            if (fb1dom) {
                var c1 = echarts.getInstanceByDom(fb1dom);
                if (c1) {
                    c1.setOption({
                        legend: {
                            orient: 'horizontal',
                            right: 'auto',
                            left: 'center',
                            top: 'auto',
                            bottom: 2,
                            itemWidth: 8, itemHeight: 8, itemGap: 5,
                            textStyle: { color: 'rgba(255,255,255,.7)', fontSize: 9 }
                        },
                        series: [{ center: ['50%', '48%'], radius: ['35%', '55%'] }]
                    });
                }
            }
            // fb2 城乡人口：同理
            var fb2dom = document.getElementById('fb2');
            if (fb2dom) {
                var c2 = echarts.getInstanceByDom(fb2dom);
                if (c2) {
                    c2.setOption({
                        legend: {
                            orient: 'horizontal',
                            right: 'auto',
                            left: 'center',
                            top: 'auto',
                            bottom: 2,
                            itemWidth: 8, itemHeight: 8, itemGap: 8,
                            textStyle: { color: 'rgba(255,255,255,.7)', fontSize: 9 }
                        },
                        series: [{ center: ['50%', '48%'], radius: ['35%', '55%'] }]
                    });
                }
            }
        }

        // 等待所有图表初始化完毕后再修复
        setTimeout(function() {
            fixMapVisualMap();
            fixFbLegends();
        }, 800);
        // 再延迟一次确保异步数据加载的图表也能修复
        setTimeout(function() {
            fixMapVisualMap();
            fixFbLegends();
        }, 2000);
    })();
</script>
